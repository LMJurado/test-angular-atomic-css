<div class="tabs" role="tablist">
  @for (tab of tabs(); track tab.id) {
    <button class="tabs__item" role="tab" [class.tabs__item--active]="activeTab() === tab.id" [attr.aria-selected]="activeTab() === tab.id" [disabled]="tab.disabled" (click)="selectTab(tab.id)">
      {{ tab.label }}
    </button>
  }
</div>

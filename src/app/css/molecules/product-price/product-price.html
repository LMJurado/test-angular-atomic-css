<div class="product-price">
  <div class="product-price__main">
    <span class="product-price__value">COP {{ formatPrice(presentationPrice()) }}</span>
  </div>

  @if (unitPrice() !== null) {
    <div class="product-price__unit">
      <span>COP {{ formatPrice(unitPrice()!) }} / unidad</span>
    </div>
  }

  @if (quantity() !== null && quantity() !== undefined && quantity()! > 1) {
    <span class="product-price__quantity">Contenido: {{ quantity() }} unidades</span>
  }
</div>

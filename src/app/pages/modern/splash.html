<section class="splash-container" [class.splash-exit]="isExiting">
  <div class="splash-content modern-splash">
    <img [src]="theme.theme() === 'dark' ? 'assets/img/brand-logo-for-dark-theme.png' : 'assets/img/brand-logo-for-light-theme.png'"
         alt="Academia Web & DevOps" class="splash-logo">
    <span class="badge badge--accent badge--md">ACADEMIA DIGITAL</span>
    <h1 class="welcome-title">¡Bienvenido!</h1>
    <p class="welcome-subtitle">Aprende Web, Móvil y DevOps a tu ritmo.</p>
    <div class="spinner" role="status" aria-label="Cargando"></div>
    <p class="credits-text">Universidad de Nariño</p>
  </div>
</section>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sopas de Letras</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../../css/activity-theme.css" />
  <link rel="stylesheet" href="../../css/word-search.css" />
  <script src="../../js/theme-sync.js"></script>
</head>
<body>
  <main class="container">
    <div id="game-wrapper" class="card">
      <div class="header">
        <div class="bar" aria-hidden="true"></div>
        <div class="title-wrap">
          <h1 id="game-title">Cargando juego&hellip;</h1>
          <p id="game-subtitle"></p>
        </div>
      </div>

      <div class="game-toolbar">
        <button id="fullscreen-btn" class="toolbar-btn" aria-label="Pantalla completa">
          <i class="fas fa-expand"></i>
        </button>
      </div>

      <section id="game-container" aria-label="Actividad"></section>

      <div id="completion-modal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <h2 id="modal-title"><i class="fas fa-trophy"></i> ¡Felicidades!</h2>
          <p id="modal-message">Has completado el juego.</p>
          <button id="modal-restart-btn" class="modal-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </main>

  <script src="../../js/word-search/core.js" type="module"></script>
</body>
</html>
